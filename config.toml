# Behavior settings. Secrets live in .env, not here.

[bot]
# Prefix for chat commands (e.g. "!list", "!help"). Slash commands work too.
prefix = "!"
# Model for Claude Code. Blank uses Claude Code's default.
model = ""
# Base path for new sessions. "new" with no arg starts here, and "new myrepo"
# resolves to "<default_cwd>/myrepo". Full paths still work. Blank uses the
# directory the bot was launched from.
default_cwd = "/Users/andrewlau/Documents/Pacific/"
# Seconds to wait for a tool approval before denying.
approval_timeout = 300
# SQLite file for channel pins.
db_path = "sessions.db"
# Skills to load: "all", "none", or a list like ["pdf", "xlsx"].
skills = "all"

[tools]
# Starting set of tools that run without asking. This only seeds the very
# first run -- after that the !auto-approve panel owns the list and stores it
# in approvals.json next to the database. Change it there, not here.
auto_approve = ["Read", "Glob", "Grep", "NotebookRead", "TodoWrite", "Bash"]

[context]
# Warn when the session's context window passes this percentage, then again at
# warn_again_at. The warning offers compact / handoff / ignore. Set warn_at = 0
# to turn the warnings off.
warn_at = 75
warn_again_at = 90

# Per-provider settings. `bot.model` covers Claude; opencode's model is set
# here as "provider/model". Leave commented to use opencode's own default.
# [providers.opencode]
# model = "anthropic/claude-opus-4-6"
